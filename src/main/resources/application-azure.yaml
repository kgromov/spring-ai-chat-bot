spring:
  ai:
    azure:
      openai:
        api-key: ${GITHUB_TOKEN}
        endpoint: "https://models.inference.ai.azure.com"
        chat:
          options:
            model: gpt-4o
            deployment-name: gpt-4o
        embedding:
          options:
            model: text-embedding-3-small
            deployment-name: text-embedding-3-small